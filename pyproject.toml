[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensors23-wafer-repro"
version = "0.1.0"
description = "PyTorch reproduction scaffold for Sensors 2023 wafer bin map classification experiments."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
profile = ["thop>=0.1.1.post2209072238"]

[project.scripts]
wafer-train = "wafer_repro.train:main"
wafer-evaluate = "wafer_repro.evaluate:main"
wafer-infer = "wafer_repro.infer:main"
wafer-benchmark = "wafer_repro.benchmark:main"
wafer-run-paper = "wafer_repro.run_experiments:main"
wafer-collect = "wafer_repro.collect_results:main"

[tool.setuptools.packages.find]
where = ["src"]

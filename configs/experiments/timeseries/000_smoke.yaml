schema_version: 1

experiment:
  name: timeseries_smoke_cnn
  suite: timeseries_smoke
  tags:
    - timeseries
    - smoke

data:
  module: timeseries_window
  source:
    path: data/toy_timeseries.csv
    id_column: sample_id
    label_column: label
    feature_prefix: x_
  preprocessing:
    scaler: none
  split:
    strategy: stratified_holdout
    seed: 42
    test_size: 0.2
    val_fraction_of_trainval: 0.25
  augmentation:
    enabled: false
  dataloader:
    batch_size: 12
    num_workers: 0

task:
  type: classification
  loss:
    name: cross_entropy
    class_weights: none
  metrics:
    - accuracy
    - macro_f1

model:
  name: timeseries_cnn
  pretrained: false
  dropout: 0.1

train:
  trainer: supervised_torch
  seed: 42
  max_epochs: 2
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    name: none
  early_stopping:
    enabled: false
    monitor: val/macro_f1
    mode: max
    patience: 10
    min_delta: 0.0
  amp:
    enabled: false
  checkpoint:
    monitor: val/macro_f1
    mode: max

evaluation:
  splits:
    - test
  primary_metric: macro_f1
  skip_test: false

runtime:
  device: cpu
  output_dir: outputs/experiments
  run_name: timeseries_smoke
  deterministic: true

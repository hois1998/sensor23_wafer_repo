schema_version: 1

sweep:
  name: wm811k_smoke_random
  base_config: ../experiments/wm811k/000_smoke.yaml

  fixed:
    data.source.path: data/toy_LSWMD.pkl
    data.split.strategy: stratified_holdout
    data.split.seed: 42
    train.max_epochs: 1
    runtime.device: cpu

  axes:
    preprocessing:
      - name: colormap
        set:
          data.preprocessing.channel_mode: colormap
      - name: replicate
        set:
          data.preprocessing.channel_mode: replicate
    optimizer:
      - name: adam
        set:
          train.optimizer.name: adam
      - name: adamw
        set:
          train.optimizer.name: adamw

  expansion:
    mode: random
    num_trials: 2
    seed: 7

  execution:
    continue_on_error: false
    skip_completed: false
    max_workers: 2
    retry_failed: 0
